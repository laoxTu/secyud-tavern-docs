<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>默认交互</title>

    <!-- 需要 http 打开（module 脚本在 file:// 下会被浏览器拦掉），并且能访问 esm.sh。
         在仓库根目录执行：python -m http.server 8080
         然后打开 http://localhost:8080/docs/templates/workspace/默认交互.html -->

    <!-- 预设的样式：root/默认交互/styles/ -->
    <link rel="stylesheet" href="../root/默认交互/styles/ui-0.style.css" />
    <link rel="stylesheet" href="../root/默认交互/styles/component-1.style.css" />

    <!-- 与 root/默认交互/scripts/preact-0.script.json 一致，importmap 只能写在文档里 -->
    <script type="importmap">
      {
        "imports": {
          "preact": "https://esm.sh/preact@10.23.1",
          "preact/": "https://esm.sh/preact@10.23.1/",
          "@preact/signals": "https://esm.sh/@preact/signals@1.3.0?external=preact"
        }
      }
    </script>
  </head>
  <body>
    <!-- 模拟主应用推给界面的数据，脚本第一次渲染就读它 -->
    <script>
      window.__messageData = {
        content: {
          inputs: [
            '推开木门，屋里一片昏暗。',
            '我摸了摸口袋，只有半包火柴。',
          ],
          thought:
            '玩家第一次进入木屋，手上还没有任何线索。\n' +
            '先交代环境，再给一个能追下去的物件，别把答案直接说出来。',
          output:
            '门轴发出一声沙哑的呻吟。\n' +
            '屋里的空气又冷又潮，混着木头腐朽的味道。你借着门缝漏进来的那点光，看见靠墙的小桌上摆着一盏煤油灯——灯芯是湿的，说明不久前有人点过它。',
        },
        variables: {},
      };
    </script>

    <!-- 预设的脚本：root/默认交互/scripts/，顺序不能反 -->
    <script type="module" src="../root/默认交互/scripts/components-2.script.js"></script>
    <script type="module" src="../root/默认交互/scripts/script-1.script.js"></script>
  </body>
</html>
